openapi: "3.0.3"
info:
  title: payment-service
  description: Payment Service Backend
  version: "1.0.0"
  contact:
    name: user:default/ezzdddinnemhamdi
servers:
  - url: https://payment-service.platformcatalyst.dev
    description: Production
paths:
  /:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
        - health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: payment-service
  /health:
    get:
      summary: Readiness probe
      operationId: readiness
      tags:
        - health
      responses:
        "200":
          description: Service is ready
